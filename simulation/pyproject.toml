[project]
name = "aqua-sim"
version = "0.1.0"
description = "M1 economic simulation: tracking-error/cost-of-rebalancing frontier for the Aqua Portfolio Manager (ADR-0008)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
