services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    environment:
      - FOUNDRY_DISABLE_NIGHTLY_WARNING=1
    entrypoint: ["anvil"]
    command:
      - "--fork-url"
      - "${BASE_RPC_URL:-https://mainnet.base.org}"
      - "--host"
      - "0.0.0.0"
      - "--chain-id"
      - "8453"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  deploy:
    image: ghcr.io/foundry-rs/foundry:latest
    environment:
      - FOUNDRY_DISABLE_NIGHTLY_WARNING=1
    working_dir: /app
    volumes:
      - ./packages/contracts:/app
    entrypoint: ["forge"]
    command:
      - "script"
      - "script/Deploy.s.sol"
      - "--rpc-url"
      - "http://anvil:8545"
      - "--broadcast"
      - "--private-key"
      - "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    depends_on:
      anvil:
        condition: service_healthy

  test:
    image: ghcr.io/foundry-rs/foundry:latest
    environment:
      - FOUNDRY_DISABLE_NIGHTLY_WARNING=1
    working_dir: /app
    volumes:
      - ./packages/contracts:/app
    entrypoint: ["forge"]
    command:
      - "test"
      - "--rpc-url"
      - "http://anvil:8545"
      - "-vvv"
    depends_on:
      deploy:
        condition: service_completed_successfully
