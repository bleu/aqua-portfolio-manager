name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check-contracts:
    name: Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      # Use AquaE2EBase's verified default block in both CI and local runs. Refresh the RPC
      # cache when the fixture changes, including when its pinned block is updated.
      - name: Cache Foundry RPC fork data
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-base-fork-${{ runner.os }}-${{ hashFiles('packages/contracts/test/e2e/base/AquaE2EBase.t.sol') }}

      - name: Run Forge tests
        env:
          # Falls back to the same public RPC already baked into AquaE2EBase.t.sol's own
          # vm.envOr default if the BASE_RPC_URL secret isn't configured yet -- CI doesn't start
          # hard-failing the moment this workflow merges, only once the secret is actually added.
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
        run: forge test -vvv

  check-generated-addresses:
    name: Generated addresses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @aqua-portfolio-manager/addresses

      - name: Typecheck
        run: pnpm --filter @aqua-portfolio-manager/addresses typecheck

      # Regenerates the one file Solidity needs (it can't import TS) and fails if the result
      # doesn't match what's committed -- a hand-edit or a forgotten regeneration both fail here.
      - name: Regenerate Solidity constants and diff
        run: |
          pnpm --filter @aqua-portfolio-manager/addresses generate-solidity
          git diff --exit-code -- packages/contracts/script/generated/BaseMainnetAddresses.sol

      # config.yaml and .env.example stay hand-maintained; this only checks their addresses still
      # match src/index.ts, not that their structure was regenerated.
      - name: Check config.yaml / .env.example address drift
        run: pnpm --filter @aqua-portfolio-manager/addresses check-config-drift

  check-arbitrageur:
    name: Arbitrageur
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The trailing `...` pulls in workspace dependencies (e.g. @aqua-portfolio-manager/decoding)
      # too, not just this package itself -- needed so decoding's own `prepare` script (which
      # builds it) actually runs; a bare `--filter arbitrageur` install skips it entirely.
      - name: Install dependencies
        run: pnpm install --filter "@aqua-portfolio-manager/arbitrageur..."

      - name: Typecheck
        run: pnpm --filter @aqua-portfolio-manager/arbitrageur typecheck

      - name: Test
        run: pnpm --filter @aqua-portfolio-manager/arbitrageur test
