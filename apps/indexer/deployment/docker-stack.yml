services:
  ponder:
    image: aqua-pm-indexer:${APP_REVISION}
    build:
      # The monorepo root, not this directory -- see ../Dockerfile's own comment for why.
      context: ../../..
      dockerfile: apps/indexer/Dockerfile
    ports:
      - "${PONDER_PORT:?error}:42069"
    deploy:
      resources:
        limits:
          cpus: "0.8"
          # 1.5G, not the previous 800M: a real deploy crashed with "JavaScript heap out of
          # memory" parsing one eth_getLogs response for Base's busiest tokens (see
          # ponder.config.ts's ethGetLogsBlockRange comment, which bounds request size going
          # forward) -- this raises the ceiling as a second line of defense, not the primary fix.
          memory: 1.5G
    restart: always
    environment:
      # Direct to postgres, not pgbouncer: Ponder relies on advisory locks and LISTEN/NOTIFY (for
      # its live-query support) that need a session-pinned connection, which pgbouncer's
      # transaction-pool mode (see docker-compose.yml's POOL_MODE) can't guarantee -- confirmed via
      # a real deploy attempt, which failed with "Connection terminated unexpectedly" during
      # Ponder's own startup diagnostic query against pgbouncer. A single indexer process has no
      # need for pgbouncer's connection multiplexing anyway.
      DATABASE_URL: postgres://${POSTGRES_USER:?error}:${POSTGRES_PASSWORD:?error}@postgres:5432/${POSTGRES_DB:?error}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      BASE_RPC_URL: ${BASE_RPC_URL:?error}
      TUI_OFF: ${TUI_OFF:-true}
      # Raises V8's old-space ceiling to fit inside the 1.5G container limit above (Node's own
      # default is independent of the container's cgroup memory, so it OOM'd well under the old
      # 800M cap too).
      NODE_OPTIONS: --max-old-space-size=1280

networks:
  default:
    name: ${PROJECT_PREFIX:?error}-default
    external: ${EXTERNAL_RESOURCES:-false}
