services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?error}
      POSTGRES_USER: ${POSTGRES_USER:?error}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    ports:
      - "${POSTGRES_PORT:?error}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "${REDIS_PORT:?error}:6379"
    volumes:
      - redis-data:/data

  # Dedicated to this service alone -- not shared with the byos project's own Fynd containers
  # running on the same host (different chain, different team's deployment). Pinned to the same
  # image tag already proven working there. --tycho-url is deliberately not overridden: Fynd
  # defaults it to the right endpoint for --chain base on its own (confirmed via `fynd serve
  # --help`); the byos BSC instances override it because BSC isn't one of Fynd's defaults.
  fynd:
    image: ghcr.io/propeller-heads/fynd:0.114.4
    restart: unless-stopped
    command: ["serve", "--chain", "base"]
    environment:
      TYCHO_API_KEY: ${TYCHO_API_KEY:?error}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    ports:
      - "${FYND_HOST_PORT:?error}:3000"

networks:
  default:
    name: ${PROJECT_PREFIX:?error}-default
    external: ${EXTERNAL_RESOURCES:-false}
    driver: overlay
    attachable: true

volumes:
  postgres-data:
    name: ${PROJECT_PREFIX:?error}-postgres-data
    driver: local
  redis-data:
    name: ${PROJECT_PREFIX:?error}-redis-data
    driver: local
