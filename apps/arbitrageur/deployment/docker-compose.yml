services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?error}
      POSTGRES_USER: ${POSTGRES_USER:?error}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    ports:
      - "${POSTGRES_PORT:?error}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "${REDIS_PORT:?error}:6379"
    volumes:
      - redis-data:/data

networks:
  default:
    name: ${PROJECT_PREFIX:?error}-default
    external: ${EXTERNAL_RESOURCES:-false}
    driver: overlay
    attachable: true

volumes:
  postgres-data:
    name: ${PROJECT_PREFIX:?error}-postgres-data
    driver: local
  redis-data:
    name: ${PROJECT_PREFIX:?error}-redis-data
    driver: local
