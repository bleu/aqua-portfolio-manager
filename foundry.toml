[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "aqua/=lib/aqua/src/",
    "swap-vm/=lib/swap-vm/src/",
]

# lib/balancer-v3-monorepo is reference-only (GPL-3.0) — see THIRD_PARTY_NOTICES.md.
# Never import from it. No remapping is defined for it on purpose.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
